<!DOCTYPE html>
<html>
    <head lang="en">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Учебный мессенджер Влад</title>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <header class= "pages-header">
            <h1>Новый мессенджер</h1>
        </header>

        <form class="form" action="/">
            <div class="message">История сообщений</div>
            <div class="history"></div>
            <textarea class="texteria" name="message-text" rows="3" placeholder="Введите сообщение (Enter-отправить, Ctrl+Enter-новая строка)"></textarea>
    <div class="controls">
        <button type="submit">Отправить</button>
        <button type="button" class="clear-btn">Очистить историю</button>
    </div>
        </form>
        <script type="module" src="./index.js"></script>
    </body>
